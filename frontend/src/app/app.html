<div class="flex min-h-screen flex-col bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3 lg:px-8">
      <div class="flex items-center gap-6">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[0.25em] text-cyan-400">CodeBranch</p>
          <p class="text-sm font-medium text-slate-100">Financial Dashboard</p>
        </div>

        <nav class="flex items-center gap-1 text-sm">
          <a
            routerLink="/"
            routerLinkActive="bg-slate-800 text-cyan-300"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-3 py-1.5 text-slate-300 transition hover:bg-slate-800 hover:text-white"
          >
            Dashboard
          </a>
          @if (auth.isAdmin()) {
            <a
              routerLink="/audit"
              routerLinkActive="bg-slate-800 text-cyan-300"
              class="rounded-lg px-3 py-1.5 text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
              Auditoría
            </a>
          }
        </nav>
      </div>

      <div class="flex items-center gap-3">
        @if (auth.user(); as user) {
          <span class="hidden rounded-full border border-slate-700 px-3 py-1 text-xs uppercase tracking-wide text-slate-400 sm:inline">
            {{ user.role }}
          </span>
        }
        <app-role-switcher />
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 lg:px-8">
    @if (auth.error() && !auth.isAuthenticated()) {
      <div class="mb-6 rounded-xl border border-rose-900/60 bg-rose-950/40 px-4 py-4 text-sm text-rose-200">
        <p>{{ auth.error() }}</p>
        <button
          type="button"
          class="mt-3 rounded-lg bg-rose-500 px-3 py-1.5 text-xs font-medium text-white"
          (click)="retrySession()"
        >
          Reintentar conexión
        </button>
      </div>
    }

    @if (auth.isAuthenticated()) {
      <router-outlet />
    } @else if (!auth.error()) {
      <p class="py-16 text-center text-sm text-slate-500">Conectando con la API…</p>
    }
  </main>
</div>
