<div class="flex items-center gap-3">
  @if (auth.loading()) {
    <mat-spinner diameter="22"></mat-spinner>
  }

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="role-field min-w-44">
    <mat-label>Sesión</mat-label>
    <mat-select
      [value]="auth.role()"
      [disabled]="auth.loading()"
      (selectionChange)="onRoleChange(asRole($event.value))"
    >
      @for (option of roles; track option.value) {
        <mat-option [value]="option.value">
          <span class="font-medium">{{ option.label }}</span>
          <span class="ml-2 text-xs opacity-70">{{ option.hint }}</span>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
